    <script>
      // Defensive guard against third-party Web3 browser extension collisions (e.g. Phantom / MetaMask evmAsk.js)
      try {
        let _eth = window.ethereum;
        Object.defineProperty(window, 'ethereum', {
          configurable: true,
          enumerable: true,
          get() { return _eth; },
          set(val) { _eth = val; }
        });
      } catch (_) {
        // Fallback if environment pre-locks properties
      }

      // Intercept and swallow third-party extension runtime exceptions
      window.addEventListener('error', function(event) {
        if (
          event?.filename?.includes('chrome-extension://') ||
          event?.message?.includes('ethereum') ||
          event?.message?.includes('Cannot redefine property')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var msg = event?.reason?.message || String(event?.reason || '');
        var stack = event?.reason?.stack || '';
        if (
          stack.includes('chrome-extension://') ||
          msg.includes('ethereum') ||
          msg.includes('Cannot redefine property')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
